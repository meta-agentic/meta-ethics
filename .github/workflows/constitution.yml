name: constitution

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'constitution/**'
      - 'docs/adr/**'
      - 'evidence/checker/**'
      - '.github/workflows/constitution.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Fragment, symmetry, kinds, binding, fixtures, sources, parameters, manifest
        run: constitution/tools/check.sh
