name: constitution

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'constitution/**'
      - 'docs/adr/**'
      - 'evidence/checker/**'
      - '.github/workflows/constitution.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Fragment, symmetry, kinds, binding, fixtures, sources, parameters, manifest, mutants, configuration
        run: constitution/tools/check.sh
